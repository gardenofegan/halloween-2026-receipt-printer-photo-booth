<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Booth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <video id="webcam" autoplay playsinline style="transform: scaleX(-1);"></video>
        <canvas id="preview-canvas" style="display: none; position: absolute; top:0; left:0; width:100%; height:100%; object-fit: contain; z-index: 5; background: white;"></canvas>
        <img id="frame-img" src="frame.png" style="display:none;">
        <div id="status-overlay" style="display: none;"></div>
        <button id="capture-btn">Take Photo</button>
    </div>
    <script src="camera.js"></script>
    <script src="processor.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('webcam');
            if (typeof startCamera !== 'undefined') startCamera(video);
        });
    </script>
</body>
</html>
